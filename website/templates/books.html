{% extends 'base.html' %}
{% block stylesheet %}
    <link rel="stylesheet" href="{{ url_for('static', filename='books.css') }}">
{% endblock %}
{% block content %}
    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Title</th>
          <th scope="col">Genre</th>
          <th scope="col">Published Year</th>
        </tr>
      </thead>
      <tbody>
        {% for book in books %}
            <tr>
              <th scope="row">{{ book.id }}</th>
                <td><a href="books/{{ book.title }}">{{ book.title }}</a></td>
              <td>{{ book.genre }}</td>
              <td>{{ book.year_first_published}}</td>
            </tr>
        {% endfor %}
      </tbody>
    </table>
{% endblock %}
